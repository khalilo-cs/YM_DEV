[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yemendev"
version = "0.1.0"
description = "YEMENDEV AI - Autonomous Digital Resilience & Evolution Platform (early core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42",
    # JavaScript/TypeScript understanding (parsing only; grammars ship as wheels, no network at runtime)
    "tree-sitter>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
    # PEP 440 version comparison for vulnerability matching
    "packaging>=23",
    # tracing API (no-op until an SDK is configured; see the `otel` extra)
    "opentelemetry-api>=1.20",
    # the process sandbox runs project test suites with the platform's interpreter (`python -m pytest`)
    "pytest>=8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "opentelemetry-sdk>=1.20"]
# Export traces: YEMENDEV_OTEL=console|otlp (OTLP endpoint via the standard OTEL_EXPORTER_OTLP_* variables)
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-http>=1.20"]

[project.scripts]
yemendev = "yemendev.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
yemendev = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S603", "S404", "S607", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["yemendev"]
